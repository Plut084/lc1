name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2
  SLANG_VERSION: 2026.18.3

jobs:
  linux:
    name: Linux / Clang / Debug
    runs-on: ubuntu-24.04
    # Match profiles/linux: Clang 22 with a C++23-capable libstdc++.
    container: fedora:44
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          dnf install -y clang gcc-c++ cmake ninja-build python3 python3-pip git curl-minimal tar gzip zstd pkgconf-pkg-config autoconf automake libtool make perl patch diffutils libglvnd-devel
          python3 -m venv /opt/ci
          echo /opt/ci/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Install Conan
        run: python -m pip install conan==2.27.0
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-v1-fedora44-clang22-debug-${{ hashFiles('conanfile.py', 'profiles/linux') }}
      - name: Install Slang
        run: |
          curl --fail --location --retry 3 "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.28.tar.gz" -o /tmp/slang.tar.gz
          mkdir -p /opt/slang
          tar -xzf /tmp/slang.tar.gz -C /opt/slang
          echo /opt/slang/bin >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          conan profile detect --force
          conan install . -pr:h profiles/linux -pr:b default --build=missing -s build_type=Debug -c tools.build:jobs=2
      - name: Configure and build
        run: |
          # Assets are not tracked; only compilation is checked in CI.
          mkdir -p assets
          cmake --preset linux-x86_64-debug -DBUILD_TESTING=OFF
          cmake --build --preset linux-x86_64-debug --parallel 2

  windows:
    name: Windows / MSVC / Debug
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install conan==2.27.0 cmake==3.31.10 ninja==1.13.0
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-v1-windows2022-msvc194-debug-${{ hashFiles('conanfile.py', 'profiles/windows') }}
      - name: Install Slang
        run: |
          $archive = "$env:RUNNER_TEMP/slang.zip"
          $destination = "$env:RUNNER_TEMP/slang"
          Invoke-WebRequest "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $destination
          "$destination/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        shell: cmd
        run: |
          conan profile detect --force
          if errorlevel 1 exit /b 1
          conan install . -pr:h profiles/windows -pr:b default --build=missing -s build_type=Debug -c tools.build:jobs=2
      - name: Configure and build
        shell: cmd
        run: |
          rem Assets are not tracked; only compilation is checked in CI.
          if not exist assets mkdir assets
          cmake --preset windows-x86_64-debug -DBUILD_TESTING=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset windows-x86_64-debug --parallel 2
