# One record per concrete person, every one with its own keyid and data; a troop template
# is not a runtime entity. No keyid is special: session.yaml names the player and the AI
# demonstration character, and both are ordinary records here.
#
# equipment and weapon are maps keyed by an enum. An enum cannot be a YAML mapping key,
# so reflect-cpp writes each entry as a [key, value] pair.
